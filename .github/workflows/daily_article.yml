name: Fetch Daily TOEFL Article

on:
  schedule:
    # 每天北京时间早上 6:00 自动抓取最新权威学术文章 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 同时也支持手动在 GitHub 页面点击触发

permissions:
  contents: write

jobs:
  update-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run fetch script
        run: python fetch_article.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-fetch daily TOEFL article" && git push)
