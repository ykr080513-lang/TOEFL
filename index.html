<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5e1f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TOEFL 每日打卡</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#15171f;--panel:#1d2130;--line:rgba(146,168,204,.16);
  --wine:#7a2736;--wineD:#471722;--wineL:#d76a7c;
  --mist:#35425f;--mistL:#92a8cc;
  --paper:#f2e9d3;--kraft:#c9b184;--ink:#372c1d;
  --txt:#eae5d6;--dim:#b0a896;--ok:#7fb98a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.75 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
 radial-gradient(900px 520px at 12% -6%,rgba(122,39,54,.40),transparent 62%),
 radial-gradient(820px 600px at 102% 18%,rgba(53,66,95,.38),transparent 62%),
 radial-gradient(700px 520px at 50% 112%,rgba(122,39,54,.20),transparent 60%)}
header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:rgba(21,23,31,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.5px}.brand b{color:var(--wineL)}
.hud{display:flex;gap:8px;align-items:center;font-size:13px}
.chip{padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.chip.fire{color:var(--wineL);font-weight:600}
.mini{padding:4px 12px;border-radius:999px;border:1px solid rgba(215,106,124,.4);background:var(--wineD);color:var(--wineL);cursor:pointer;font-size:12px}
#tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:12px 8px}
#tabs button{border:1px solid var(--line);background:var(--panel);color:var(--dim);padding:7px 13px;border-radius:999px;cursor:pointer;font-size:14px}
#tabs button.on{background:linear-gradient(135deg,var(--wine),var(--wineD));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(122,39,54,.45)}
main{max-width:920px;margin:0 auto 90px;padding:0 16px}
#banner{max-width:920px;margin:8px auto 0;padding:8px 16px;border-radius:10px;font-size:14px;display:none;text-align:center}
#banner.warn{display:block;background:linear-gradient(135deg,rgba(122,39,54,.6),rgba(71,23,34,.6));border:1px solid rgba(215,106,124,.4)}
#banner.done{display:block;background:rgba(53,66,95,.55);border:1px solid rgba(146,168,204,.35)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
.mut{color:var(--dim);font-size:13px}
.btn{padding:9px 18px;border-radius:999px;border:0;cursor:pointer;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--wine),var(--wineD));box-shadow:0 4px 14px rgba(122,39,54,.4)}
.btn:active{transform:scale(.97)}
.btn.blue{background:linear-gradient(135deg,var(--mist),#242c42);box-shadow:0 4px 14px rgba(53,66,95,.4)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);box-shadow:none}
.paper{background:linear-gradient(180deg,#f4ecd9,#eadcb9);color:var(--ink);border-radius:10px;border:1px solid #d8c69c;box-shadow:0 12px 32px rgba(0,0,0,.45);position:relative;padding:26px 28px;font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;overflow:hidden}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .62 0 0 0 0 .55 0 0 0 0 .42 0 0 0 .18 0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
.paper p{margin:.9em 0;line-height:1.9}
.paper b{color:#7a2736}
.term{display:inline-block;margin:2px 6px 2px 0;padding:1px 10px;border-radius:999px;background:rgba(122,39,54,.12);border:1px solid rgba(122,39,54,.3);color:#6b2433;font-size:13px}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:0 auto}
.ring>button{width:112px;height:112px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--wine),var(--wineD));color:#fff;font-size:17px;font-weight:700;box-shadow:0 6px 20px rgba(122,39,54,.5)}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.hero .info{flex:1;min-width:220px}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:10px;margin:6px 0;background:rgba(53,66,95,.18);border:1px solid var(--line)}
.task.done{background:rgba(127,185,138,.12);border-color:rgba(127,185,138,.35)}
.task input{margin-top:5px;accent-color:#d76a7c;transform:scale(1.2)}
.task .dur{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap}
.wcard{text-align:center;padding:30px 20px}
.wcard .w{font-size:34px;font-weight:700;font-family:Georgia,serif;word-break:break-word}
.wcard .ph{color:#8a6f3f;font-size:15px;letter-spacing:.5px;margin:2px 0}
.wcard .pos{color:#8a6f3f;font-size:13px;letter-spacing:1px}
.wcard .def{font-size:16px;margin-top:10px}
.wcard .ex{margin-top:12px;font-style:italic;color:#5c4a2e;font-size:14px}
.wcard .ex b{color:#7a2736;font-style:normal}
.opt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.opt button{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--mist);color:#fff;cursor:pointer;font-size:15px}
.opt button:hover{filter:brightness(1.15)}
.bar{height:8px;border-radius:99px;background:#2a2f3f;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--wineL),var(--wine))}
.wk{border-collapse:collapse;width:100%;font-size:13px}
.wk td{border-top:1px solid var(--line);padding:10px 8px;vertical-align:top}
.wk .dow{color:var(--wineL);font-weight:600;white-space:nowrap}
.wk tr.today{background:rgba(122,39,54,.14)}
textarea,input[type=text],input[type=time],select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#171a26;color:var(--txt);font:inherit;margin:3px 0}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.stg>div{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel);cursor:pointer}
.stg>div:hover{border-color:var(--wineL)}
.stg b{color:var(--wineL)}
.snt{padding:14px 16px;border-radius:10px;background:rgba(53,66,95,.16);border:1px solid var(--line);margin:8px 0}
.snt .en{font-family:Georgia,serif;font-size:16px;line-height:1.8}
.snt .en b{color:var(--wineL)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--wineD);border:1px solid var(--wineL);color:#fff;padding:10px 20px;border-radius:999px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(-3deg)}}
.fire{display:inline-block;animation:flick 1.6s infinite}
@media(max-width:720px){
 #tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(21,23,31,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);justify-content:flex-start;overflow-x:auto;padding:8px 10px;z-index:50;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
 #tabs button{flex:0 0 auto;padding:6px 11px;font-size:13px}
 main{padding:0 12px}
 .opt{grid-template-columns:1fr}
 .hero{gap:14px}
}
</style>
</head>
<body>
<header>
  <div class="brand">TOEFL <b>每日打卡</b></div>

    <span class="chip">⭐ <b id="xpN">0</b></span>
    <button class="mini" id="installBtn" style="display:none">安装到本机</button>
  </div>
</header>
<div id="banner"></div>
<nav id="tabs"></nav>
<main id="app"></main>

{title:"From Wolf to Watchdog: The Domestication of the Dog",cat:"Anthropology / History",
terms:[["domestication","驯化"],["scavenger","食腐动物"],["starch","淀粉"],["selective breeding","选择育种"],["divergence","分化"]],
paras:[
"Long before farmers cleared the first field of wheat, and long before potters fired the first clay vessel, a quieter partnership had already begun at the edge of human campfires. Somewhere between 15,000 and 30,000 years ago, gray wolves began to shadow the bands of hunter-gatherers who moved across the late Ice Age landscape. The story of how those wary predators became the dog—the first domesticated animal and, for most of history, the only one—is one of the most intriguing puzzles in archaeology. The evidence is scattered, the timeline is contested, and each new genetic study seems to redraw the map.",
"The most persuasive current account is known as self-domestication. Hunter-gatherer camps produced refuse heaps of bones, scraps, and broken shells. Wolves that dared to feed at the edge of those heaps gained a steady food source, but only if they could tolerate the proximity of humans. The boldest, calmest animals ate best and survived to raise offspring that inherited something of that tameness. Over many generations, this simple filter favored a population of wolves that was smaller-headed, shorter-snouted, and markedly less fearful. Biologists summarize the process bluntly: survival of the friendliest. No human plan was required at first; the advantage ran in both directions from the start.",
"What did humans gain from the arrangement? Even a half-tame wolf is a superb alarm system, raising a chorus at the approach of strangers or predators in the dark. On the hunt, wolves could track and drive game that humans, with their weak noses and modest speed, could not easily find. The partnership also carried costs—competing for the same meat—so scholars assume the relationship tightened slowly, in places where game was plentiful enough to share. In lean valleys the experiment presumably failed, and the wolves were driven off or eaten. Domestication, in other words, was not a single event but a long series of local trials.",
"The archaeological record supports the depth of the bond. At Bonn-Oberkassel in Germany, a 14,000-year-old burial held the remains of a young dog, carefully laid to rest alongside two humans; the animal had been ill and could not have survived without care. Similar graves appear across Europe and Siberia, some with dogs wearing collars of antler or amber. These are not the remains of livestock. They suggest an emotional attachment that predates agriculture by millennia and hint that dogs earned their place in human households as companions first and tools second.",
"Genetics complicates the tidy picture. Comparisons of dog and wolf DNA suggest the two lineages separated somewhere between 15,000 and 40,000 years ago, an awkwardly wide window that fuels continuing debate. One firm finding, however, is that modern dogs carry extra copies of a gene for producing amylase, the enzyme that digests starch, whereas wolves have few. Dogs, in other words, evolved to live on the grain-rich diets of farming villages. Some researchers read this as evidence for a second stage of domestication, or at least of refinement, that occurred in the early farming settlements of the Neolithic, after the first, older split.",
"Only in the past two centuries did the explosion of breeds begin, as breeders selected deliberately for size, coat, nose, and temperament, producing everything from sheep-guarding mastiffs to lap-sized companions. Yet beneath the astonishing variety, the ancient foundation remains: an animal tuned by thousands of generations of proximity to read human gestures, voices, and moods better than any other species. The dog did not merely adopt us. The two species, in a very real sense, grew up together, each reshaping the other's history at the edge of the fire."
]},
{title:"Coral Reefs: The Rainforests of the Sea",cat:"Marine Biology / Ecology",
terms:[["polyp","珊瑚虫"],["zooxanthellae","虫黄藻"],["symbiosis","共生关系"],["bleaching","白化"],["calcification","钙化"]],
paras:[
"To a snorkeler drifting above a reef, the scene looks like a garden of stone in bloom: branching antlers, folded brains, and delicate fans, all crowded with fish of every conceivable color. Yet the reef-builder itself is neither plant nor mineral but an animal—a coral polyp, a soft-bodied creature related to jellyfish and anemones. Each polyp is roughly the size of a pencil eraser. It secretes a tiny limestone cup around itself, divides into clones, and over centuries those stacked cups become the great architecture we call a coral reef.",
"A polyp is a capable but modest predator, snagging plankton with stinging tentacles at night. The reef's real engine lies inside its tissues: microscopic algae called zooxanthellae. In one of the most productive partnerships in nature, the algae photosynthesize and hand over most of the sugars they make—as much as ninety percent of the polyp's energy—while receiving shelter and nutrients in return. This symbiosis explains nearly everything about where reefs live: the algae need sunlight, so corals stay in shallow, clear water, and the partnership needs warmth, which confines most reefs to the tropics.",
"The output of that partnership is out of all proportion to the space it occupies. Coral reefs cover well under one percent of the ocean floor, yet they shelter perhaps a quarter of all marine species at some point in their life cycle. They break storm waves, protecting coastlines and the cities behind them; they support fisheries that feed hundreds of millions of people; and they contribute billions of dollars a year through tourism and medicine. For many island nations, the reef is not scenery but infrastructure.",
"That infrastructure is now under systematic strain. When seawater stays hotter than the local norm for too long, stressed polyps expel their algae, as if evicting the tenants who pay the rent. Stripped of pigment, the coral skeleton shows through white—a condition called bleaching. A bleached colony is starving, not dead; if the heat passes quickly, algae return and the coral recovers. If it does not, the colony dies and algae-eating fish give way to smothering seaweed. Global bleaching events, once rare, have struck repeatedly since 1998, and the episode of 2016 damaged much of the Great Barrier Reef.",
"Heat is not the only threat. The ocean absorbs roughly a quarter of the carbon dioxide humanity emits, and dissolved CO2 lowers the water's pH and its store of carbonate ions—the raw material corals use to build their skeletons. This process, ocean acidification, slows calcification and weakens the structures that new polyps construct. A reef thus caught between warmer water, which starves it, and more acidic water, which disarms its masonry, recovers from damage ever more slowly, while storms and predatory starfish strike more often than before.",
"There are grounds for stubborn hope. Marine biologists now raise coral fragments in underwater nurseries and replant them on damaged stretches; some coral strains show inherited heat tolerance; and reefs in naturally hot, fluctuating lagoons are revealing how adaptation might work. But restoration is expensive and small against the scale of the problem. The reefs that survive this century will mostly be the ones whose ultimate remedy arrives in time: a slowing of warming itself. Everything else is a bridge, and the window for building it is narrowing."
]},
{title:"The Little Ice Age: When the World Grew Cold",cat:"Climate History",
terms:[["proxy","代用资料"],["aerosol","气溶胶"],["growing season","生长期"],["famine","饥荒"],["variability","（气候）波动性"]],
paras:[
"Between roughly 1300 and 1850, much of the Northern Hemisphere experienced a stretch of colder, stormier, less predictable weather—a period historians now call the Little Ice Age. It was no true ice age: global average temperatures dipped by perhaps one to two degrees Celsius. But the averages understate the impact. In an era when nearly everyone ate from local harvests, a shorter growing season of even a few weeks could turn a lean year into a hungry one, repeated cold years could empty a valley, and shifting sea ice could close a shipping route for good.",
"Thermometers barely existed before the seventeenth century, so scientists reconstruct the period from proxies—natural archives that record climate. Tree rings widen in warm years and narrow in cold ones; glaciers preserve ash and air in layered ice; lake sediments hold pollen from whatever plants could survive nearby. Human records help as well: monastery diaries noting failed harvests, tax rolls listing abandoned farms, and Dutch and English paintings of frost fairs held on rivers that now rarely freeze. The proxies agree on the broad pattern, though they disagree about exactly when the coldest decades fell.",
"What caused the chill? Three candidates lead the list. First, solar activity: sunspot observations, rare before 1610, show that the sun went strangely quiet from 1645 to 1715, the so-called Maunder Minimum, emitting slightly less energy. Second, volcanoes: major eruptions such as Samalas in 1257 and Tambora in 1815 threw sulfate aerosols into the stratosphere, veiling the sun; 1816 became the infamous 'year without a summer,' with snow in June across New England and crop failure across Europe. Third, a possible slowdown of the ocean circulation that carries warm water northward. Most likely the Little Ice Age was all three, overlapping.",
"The consequences rippled through society. Norse settlements in Greenland, founded during a milder era, withered as pasture turned to tundra and sea ice cut off supply ships; by 1500 they were gone. In mountain villages across the Alps, advancing glaciers swallowed farmland; in China and Europe, cold, wet summers brought bread shortages and, some historians argue, helped fuel unrest. Wine grapes retreated from England; cod fishermen followed shifting waters toward new banks and, in a roundabout way, toward collisions over fishing rights that helped seed colonial rivalry.",
"Yet the Little Ice Age also teaches caution. It was not uniformly cold everywhere at once, and its causes were natural in origin—volcanoes and a drowsy sun—which is precisely why it cannot be used to dismiss modern warming. What it does offer is a controlled experiment of sorts: a modest, naturally forced climate shift, and a clear record of how even modest shifts rearranged harvests, trade, and settlement. The lesson for the present is less about temperature itself than about sensitivity. Societies are tuned to the climate they know; the bill for a faster, larger shift is steeper still.",
"The period closed in the mid-nineteenth century, as temperatures climbed back toward today's levels. There is an irony in the timing: the Little Ice Age ended just as industrialization began pouring carbon dioxide into the sky, and early paintings of frozen rivers now serve as a baseline against which the modern thermometer's climb is measured. A world that once shivered through volcano-darkened summers is now running a very different experiment, this one of its own making, and at a speed no frost fair ever suggested was possible."
]},
{title:"Why Sleep Is a Study Skill: Memory and the Sleeping Brain",cat:"Neuroscience / Psychology",
terms:[["consolidation","（记忆）巩固"],["hippocampus","海马体"],["sleep spindle","睡眠纺锤波"],["deprivation","剥夺"],["chronotype","时型"]],
paras:[
"Every student knows the puzzle: two classmates attend the same lectures, spend the same hours with the same notes, and one of them calmly aces the exam while the other scrapes by. The difference is usually attributed to talent or effort, but over the past three decades memory research has pointed to a quieter factor—the hours each of them spends asleep. Sleep, it turns out, is not a pause in learning but an active stage of it, and treating it as part of study strategy rather than as lost time is among the cheapest academic advantages available.",
"To see why, consider how a new memory is stored. Freshly learned material is first held in the hippocampus, a small structure deep in the temporal lobe that acts like a fast but crowded scratchpad. Long-term storage lies in the cortex, the brain's broad outer sheet. During deep non-REM sleep, the hippocampus repeatedly replays the day's traces in compressed bursts, while slow waves from the cortex synchronize the replay and gradually integrate it into existing knowledge. Researchers call this systems consolidation: the overnight transfer of a file from temporary storage to the permanent archive.",
"The fingerprints of the process are visible in the EEG. Bursts of brain activity called sleep spindles intensify after a person learns something new, and students who generate more spindles after studying tend to remember more the next day. In one striking line of experiments, researchers played a faint sound or released a scent that had been paired with study material while learners slept; the sleeping brain replayed the associated memories, and recall of precisely those items improved. The brain, it seems, curates its own review session each night, and learners can, to a degree, stock the shelf before closing their eyes.",
"Deprivation shows the same mechanism in reverse. A single all-nighter measurably weakens the hippocampus's ability to encode new material—one widely cited study found the penalty approached forty percent—so the exhausted student cramming at dawn is running the lecture through a damaged recorder. Lost REM sleep carries its own costs, dulling the emotional tagging that makes memories vivid and the pattern-completion that underlies creative insight. The familiar feeling that facts studied at 3 a.m. have turned to fog by noon is not an illusion of morale; it is the file failing to transfer at all.",
"The practical translation is refreshingly concrete. Study the hardest material in the hour or two before sleep, when overnight consolidation can seize on it. Take a sixty-to-ninety-minute nap after a heavy study session; it contains a full cycle of deep sleep and reliably improves later recall. Space review across days rather than stacking it into one vigil, because each night of sleep between exposures strengthens the trace. Keep a steady schedule—fragmented sleep fragments replay—and move caffeine earlier, since its half-life of five or six hours means an afternoon coffee is still on duty at midnight.",
"Two honest caveats remain. Sleep need and timing vary with chronotype, so the lark's schedule will frustrate the owl, and the science of dreaming is still young, with rival theories contesting how much consolidation happens in which stage. But the core finding has survived decades of replication: memory is written twice, once in waking attention and again in sleep. The student who protects sleep is not avoiding work. That student is simply finishing it."
]},
{title:"The City That Runs a Fever: Urban Heat Islands",cat:"Environmental Science",
terms:[["albedo","反照率"],["evapotranspiration","蒸散发"],["thermal mass","热质量"],["heat wave","热浪"],["mortality","死亡率"]],
paras:[
"Stand on a rooftop at midnight after a hot summer day and the city below still radiates warmth, while a field outside town has already cooled. This is the urban heat island: a city that runs one to seven degrees Celsius hotter than its surroundings, with the largest gap at night, not at noon. The effect is strong enough to bend weather itself—thunderstorms drift toward hot downtown air—and it is measured daily by dense sensor networks, satellite instruments, and, increasingly, volunteers who drive streets with thermometers strapped to their cars.",
"The causes stack neatly. Dark asphalt and black roofs have low albedo, absorbing sunlight instead of reflecting it. Where trees and grass once cooled the air through evapotranspiration—the botanical equivalent of sweating—pavement replaces them with surface that cannot sweat. Buildings of concrete and brick store the day's heat in their thermal mass and release it slowly after sunset, which is why the worst discomfort arrives at two in the morning. On top of all this, the city runs its own furnace: air conditioners pumping heat outdoors, engines idling, and industry venting around the clock.",
"The consequences are priced in lives and megawatts. Each extra degree of evening temperature pushes electricity demand upward as air conditioning labors through the night, and that demand is often met by power plants whose emissions warm the planet in turn. The health ledger is starker: during heat waves, the deadliest weather hazard in many countries, urban nighttime heat denies tired bodies the recovery of cool sleep, and mortality climbs among the elderly, the chronically ill, and those without air conditioning. Heat also cooks urban air into smog, adding respiratory harm on top of the thermal burden.",
"The engineering counterattack proceeds on three fronts, all tested. Cool roofs and reflective pavements raise the city's albedo, bouncing sunlight straight back to the sky. Street trees do double duty, shading surfaces that would otherwise bake while transpiring water through their leaves; a healthy canopy can cool a block by several degrees, and studies of tree-planting programs have measured reductions in heat-related illness. Green roofs combine the two, insulating the building below while cooling the air above. None of this is exotic; most of it amounts to choosing lighter materials and leaving room for vegetation.",
"There is also an uncomfortable geography to the fever. Across many cities, mapping projects find the hottest neighborhoods are the poorest: fewer trees, more pavement, older housing, and the least air conditioning, a pattern in the United States that often traces directly to decades-old decisions about where investment was allowed. Heat, in other words, is not distributed like weather but like wealth. City governments have begun ranking neighborhoods by heat vulnerability and targeting planting and retrofit programs accordingly, treating shade as public health infrastructure rather than decoration.",
"As the climate warms, heat waves arrive more often, last longer, and reach higher, so the heat island is no longer a local curiosity but a risk multiplier stacked on a global trend. A city that trims its own fever buys its residents real protection—cooler nights, lighter grids, fewer avoidable deaths—at a cost measured mainly in paint, trees, and foresight. The lesson written in every rooftop sensor is the same: the city is a climate its residents build, and it is one of the few climates they can rebuild on purpose."
]}

const LS="toeflV1";let BANK=WORDS.slice();
function def(){return{stage:null,firstDay:dk(new Date()),cursor:0,curDate:null,curWords:[],prevWords:[],dailyN:20,checkins:{},pool:[],artQueue:[],artRound:0,artToday:null,weekReviews:{},reminders:["09:00","20:00"],notified:{},xp:0,learned:{}}}

function save(){localStorage.setItem(LS,JSON.stringify(S))}
function dk(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function isoWeek(d){const t=new Date(d);t.setDate(t.getDate()+4-(t.getDay()||7));const y=new Date(t.getFullYear(),0,1);return t.getFullYear()+"-W"+Math.ceil(((t-y)/864e5+1)/7)}
function weekMonday(d){const m=new Date(d);m.setDate(m.getDate()-((m.getDay()+6)%7));return m}
function parityOfMon(m){return Math.floor(Math.floor(new Date(m.getFullYear(),m.getMonth(),m.getDate()).getTime()/864e5+3)/7)%2}
const $=s=>document.querySelector(s);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600)}

function speak(txt){try{const u=new SpeechSynthesisUtterance(txt);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=784;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.8);o.start();o.stop(c.currentTime+.8)}catch(e){}}

/* 词库合并：任何来源（words.json / ECDICT 导入）都走这里，按单词去重 */
function mergeBank(arr){
  const known=new Set(BANK.map(w=>String(w[0]).toLowerCase()));
  let add=0;
  (arr||[]).forEach(w=>{
    if(!Array.isArray(w)||!w[0])return;
    const wd=String(w[0]).toLowerCase().trim();
    if(!wd||known.has(wd))return;known.add(wd);
    BANK.push([wd,String(w[1]||""),String(w[2]||""),String(w[3]||""),String(w[4]||"")]);add++;
  });
  return add;
}

/* 每日滚动：发新词 + 选文章（修复版：确保能读到动态追加的新文章） */
function ensureDay(){
  const td=dk(new Date());
  if(S.curDate!==td){
    const finished=!S.curWords.length||S.curWords.every(i=>S.learned[i]);
    if(finished){S.prevWords=S.curWords.slice();S.curWords=nextWords()}
    S.curDate=td;S.notified={};
    save();
  }
  // 如果今日文章不存在，或者队列空了，重新洗牌文章索引（基于当前总文章数 ARTICLES.length）
  if(!S.artToday || S.artToday.date!==td){
    if(!S.artQueue || !S.artQueue.length){
      S.artQueue=shuf(ARTICLES.map((_,i)=>i));
      S.artRound=(S.artRound||0)+1;
    }
    S.artToday={date:td,idx:S.artQueue.pop()};
    save();
  }
}
  save();
}
function nextWords(){const arr=[];for(let i=0;i<S.dailyN&&S.cursor<BANK.length;i++)arr.push(S.cursor++);return arr}

function updateHUD(){
  const td=dk(new Date());const done=S.checkins[td]&&S.checkins[td].done;

  if(!(S.checkins[dk(d)]&&S.checkins[dk(d)].done))d.setDate(d.getDate()-1);

function coreTasks(){
  const td=dk(new Date());const c=S.checkins[td]||{tasks:{}};

}

  app.innerHTML=`

    <div class="info">

      <div class="mut">本周是${par?"双周":"单周"} · 今日任务 ${doneN}/${total} · 预计 ${d.dur} · 词库 ${BANK.length} 词</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
  </div>
  <div class="card"><h3>每日核心四件套（所有阶段通用）</h3>
    ${cores.map(x=>`<label class="task ${x.done?"done":""}"><input type="checkbox" ${x.done?"checked":""} data-core="${x.id}"><span>${x.name}</span><button class="dur" data-gov="${x.go}">前往 →</button></label>`).join("")}
  </div>
  <div class="card"><h3>${DOW[dow]} · 阶段任务</h3>
    ${d.t.map((t,i)=>`<label class="task ${c.tasks["p"+i]?"done":""}"><input type="checkbox" ${c.tasks["p"+i]?"checked":""} data-p="${i}"><span>${t}</span></label>`).join("")}
    <div class="mut" style="margin-top:6px">⏱ 今日时长：${d.dur}</div>
  </div>`;
  $("#ck").onclick=()=>{
    if(c.done)return;

    render();
  };
  app.querySelectorAll("[data-core]").forEach(el=>el.onchange=()=>toggleTask(el.dataset.core));
  app.querySelectorAll("[data-p]").forEach(el=>el.onchange=()=>toggleTask("p"+el.dataset.p));
  app.querySelectorAll("[data-gov]").forEach(el=>el.onclick=e=>{e.preventDefault();go(el.dataset.gov)});
}
function toggleTask(id){
  const td=dk(new Date()),c=S.checkins[td]||(S.checkins[td]={tasks:{}});
  if(c.tasks[id]){delete c.tasks[id];S.xp=Math.max(0,S.xp-10)}
  else{c.tasks[id]=1;addXP(10)}
  save();render();
}

/* ---- 词汇 ---- */
function renderVocab(mode){
  mode=mode||(S._vtab||"new");
  S._vtab=mode;
  const unseen=S.curWords.filter(i=>!S.learned[i]);
  let html=`<div class="card"><div style="display:flex;gap:8px">
    <button class="btn ${mode==="new"?"":"ghost"}" data-vt="new">新词</button>
    <button class="btn blue ${mode==="rev"?"":"ghost"}" data-vt="rev">复习昨日</button>
    <button class="btn ghost ${mode==="pool"?"":"ghost"}" data-vt="pool" style="${mode==="pool"?"background:linear-gradient(135deg,var(--mist),#242c42);color:#fff":""}">生词本 ${S.pool.length}</button></div></div>`;
  if(mode==="new"){
    if(!S.curWords.length){
      html+=`<div class="card"><h3>词库已用完 🈵</h3><p class="mut">当前词库 ${BANK.length} 词已全部发完。去「设置 → 一键导入 ECDICT 万词库」扩容到 10000 词，或点击下面开始第二轮复习。</p><button class="btn" onclick="S.cursor=0;S.learned={};save();render()">🔁 开始第二轮</button></div>`;
    }else if(!unseen.length){
      html+=`<div class="card"><h3>✅ 今日 ${S.curWords.length} 个新词已完成 +30 XP</h3><p class="mut">明天这里会出现新的 ${S.dailyN} 个词。记得去“复习昨日”做小测验。</p></div>`;
    }else{
      const i=unseen[0],w=BANK[i];const ex=w[3]||"";
      html+=`<div class="paper wcard">
        <div class="w">${w[0]}</div>
        ${w[4]?`<div class="ph">/${w[4]}/</div>`:""}
        ${w[1]?`<div class="pos">${w[1]}</div>`:""}
        <div class="def">${w[2]||""}</div>
        ${ex?`<div class="ex">${ex.replace(new RegExp(w[0].split(/[\s-]/)[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),m=>`<b>${m}</b>`)}</div>`:`<div class="ex" style="opacity:.7">（此词暂无例句，可朗读英文释义跟读）</div>`}
        <div style="margin-top:10px">
        <button class="mini" onclick="speak('${w[0].replace(/'/g,"\\'")}')">🔊 朗读单词</button>
        ${ex?`<button class="mini" onclick="speak('${ex.replace(/'/g,"\\'")}')">🔊 朗读例句</button>`:""}
        </div>
      </div>
      <div class="card"><div class="mut">剩余 ${unseen.length} / ${S.curWords.length}（总词库 ${BANK.length}）</div><div class="bar"><i style="width:${(S.curWords.length-unseen.length)/S.curWords.length*100}%"></i></div>
      <div class="opt">
        <button data-mark="ok" style="background:#2e5b45">认识 ✅</button>
        <button data-mark="fuzzy">模糊 🤔</button>
        <button data-mark="no" style="background:var(--wine)">不认识 ❌</button>
      </div></div>`;
    }
  }
  if(mode==="rev"){
    const items=(S.prevWords||[]).slice(0,20);
    if(!items.length)html+=`<div class="card"><p class="mut">昨天还没有已学完的单词，明天再来做复盘小测验。</p></div>`;
    else if(S._revQ===undefined||S._revDate!==dk(new Date())){S._revQ=shuf(items);S._revPos=0;S._revR=0;S._revDate=dk(new Date())}
    if(S._revQ&&S._revPos<S._revQ.length){
      const idx=S._revQ[S._revPos],w=BANK[idx];
      if(!S._revOpts||S._revFor!==idx){
        let opts=shuf(BANK.filter(x=>x!==w).slice(0,60)).slice(0,3).map(x=>x[0]);opts.push(w[0]);opts=shuf(opts);S._revOpts=opts;S._revFor=idx;
      }
      html+=`<div class="card"><h3>释义 → 选出单词（${S._revPos+1}/${S._revQ.length}）</h3>
      <div class="paper" style="text-align:center;font-size:20px;padding:22px">${w[2]}</div>
      <div class="opt" style="grid-template-columns:1fr 1fr">${S._revOpts.map(o=>`<button data-ans="${o}">${o}</button>`).join("")}</div>
      ${S._revMsg?`<div class="mut" style="margin-top:10px">${S._revMsg}</div>`:""}</div>`;
    }else if(S._revQ){
      const c=S.checkins[dk(new Date())]||(S.checkins[dk(new Date())]={tasks:{}});
      if(!c.tasks.c1){c.tasks.c1=1;addXP(20)}
      save();
      html+=`<div class="card"><h3>✅ 复盘完成：答对 ${S._revR}/${S._revQ.length} +20 XP</h3><p class="mut">答错的词已自动进入“生词本”，后天再战。</p></div>`;
    }
  }
  if(mode==="pool"){
    html+=`<div class="card"><h3>生词本（${S.pool.length}）</h3>${S.pool.length?S.pool.map(i=>`<div class="task"><span><b>${BANK[i][0]}</b> ${BANK[i][1]} ${BANK[i][2]}</span><button class="dur" onclick="speak('${BANK[i][0].replace(/'/g,"\\'")}')">🔊</button><button class="dur" data-rm="${i}">认识，移出 ✅</button></div>`).join(""):`<p class="mut">空空如也，很好！复习测验中答错的词会自动收进来。</p>`}</div>`;
  }
  app.innerHTML=html;
  app.querySelectorAll("[data-vt]").forEach(b=>b.onclick=()=>renderVocab(b.dataset.vt));
  app.querySelectorAll("[data-mark]").forEach(b=>b.onclick=()=>{
    const i=unseen[0];S.learned[i]=1;
    const m=b.dataset.mark;
    if(m!=="ok"&&!S.pool.includes(i))S.pool.push(i);
    if(m==="ok")addXP(3);
    const c=S.checkins[dk(new Date())]||(S.checkins[dk(new Date())]={tasks:{}});
    if(S.curWords.every(x=>S.learned[x])&&!c.tasks.c0){c.tasks.c0=1;addXP(30)}
    save();renderVocab("new");
  });
  app.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{
    const idx=S._revQ[S._revPos],right=BANK[idx][0];
    if(b.dataset.ans===right){S._revR++;S._revMsg="✅ 正确！";S.pool=S.pool.filter(x=>x!==idx);addXP(5)}
    else{S._revMsg=`❌ 正确答案：${right}（已加入生词本）`;if(!S.pool.includes(idx))S.pool.push(idx)}
    S._revPos++;S._revOpts=null;save();
    if(S._revPos>=S._revQ.length)toast("复盘小测完成！");
    renderVocab("rev");
  });
  app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.pool=S.pool.filter(x=>x!=b.dataset.rm);save();renderVocab("pool")});
}

/* ---- 句子 ---- */
function todaySentences(){
  const out=[];
  S.curWords.filter(i=>BANK[i]&&BANK[i][3]&&BANK[i][3].length>40).slice(0,4)
    .forEach(i=>out.push({s:BANK[i][3],w:BANK[i][0],d:BANK[i][2],src:"今日词汇"}));
  const a=ARTICLES[S.artToday?S.artToday.idx:0];
  if(a){[1,2,3,4,5].forEach(p=>{if(out.length<7&&a.paras[p]){
    const first=(a.paras[p].match(/[^.!?]+[.!?]/)||[""])[0].trim();
    if(first.length>30){const term=(a.terms||[]).map(t=>t[0]).find(t=>first.toLowerCase().includes(t.toLowerCase()));
      out.push({s:first,w:term,d:term?(a.terms.find(t=>t[0]===term)||[,""])[1]:"",src:"今日文章"})}}})}
  return out;
}
function renderSent(){
  const list=todaySentences(),c=S.checkins[dk(new Date())]||(S.checkins[dk(new Date())]={tasks:{}});
  app.innerHTML=`<div class="card"><h2>✍️ 今日句子（${list.length} 句）</h2>
  <p class="mut">先听朗读 → 自己跟读三遍 → 点开看关键词释义。句子主要取自今日文章与今日词汇例句。</p>
  ${list.map((x,i)=>{
    const re=new RegExp((x.w||"zzz").replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i");
    return `<div class="snt"><div class="en">${x.s.replace(re,m=>`<b>${m}</b>`)}</div>
    <div style="margin-top:6px"><button class="mini" onclick="speak('${x.s.replace(/'/g,"\\'")}')">🔊 朗读</button>
    ${x.w?`<button class="mini" onclick="this.nextElementSibling.style.display='inline'">看释义</button><span style="display:none;color:var(--mistL)">${x.w} ${x.d}</span>`:""}
    <span class="mut" style="float:right">${x.src}</span></div></div>`}).join("")}
  <button class="btn" id="sd">${c.tasks.c3?"已完成 ✓":"标记完成（+15 XP）"}</button></div>`;
  $("#sd").onclick=()=>{if(!c.tasks.c3){c.tasks.c3=1;addXP(15);save()}render()};
}

/* ---- 文章 ---- */
function renderArt(){

    let h=p;(a.terms||[]).forEach(t=>{h=h.replace(new RegExp(t[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),m=>`<b>${m}</b>`)});

/* ---- 周计划 ---- */
function renderWeek(){
  const p=PLANS[S.stage],mon=weekMonday(new Date()),par=parityOfMon(mon);
  let rows="";
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(d.getDate()+i);const key=dk(d);
    const dd=p.days[i],c=S.checkins[key],isToday=key===dk(new Date());
    const total=dd.t.length,doneN=c?dd.t.filter((_,j)=>c.tasks["p"+j]).length:0;
    rows+=`<tr class="${isToday?"today":""}"><td class="dow">${DOW[i]}<br><span class="mut">${key.slice(5)}</span></td>
    <td>${isToday?"（勾选请到“今日”页）":dd.t.map((t,j)=>`<div style="margin:2px 0;color:${c&&c.tasks["p"+j]?"var(--ok)":"inherit"}">${c&&c.tasks["p"+j]?"✓":"·"} ${t}</div>`).join("")}
    <div class="mut">${(c&&c.done)?"✅ 已打卡":""} ${doneN}/${total}</div></td>
    <td class="mut" style="white-space:nowrap">${dd.dur}</td></tr>`;
  }
  app.innerHTML=`<div class="card"><h2>${p.name} · 一周循环表</h2>
  <p class="mut">本周是${par?"双周":"单周"}${S.stage==="y2b"?"（双周=模考周）":""} · ${p.hrs} · ${p.tag}</p>
  <div style="overflow-x:auto"><table class="wk">${rows}</table></div>
  <h3>📌 周末检验标准</h3><p class="mut">${p.check}</p>
  ${p.notes.map(n=>`<p class="mut">· ${n}</p>`).join("")}
  <p class="mut">原则：周末检验不通过，下一周原地重复同类任务，不硬推进度；周日固定 20 分钟复盘（见“复盘”页四个问题）。</p></div>`;
}

    r.onload=()=>{
      $("#ecst").textContent="⚙️ 正在解析 76 万词条并筛选，请勿关闭页面（约 10–30 秒）……";
      setTimeout(()=>{
        try{
          const bank=ecdictToBank(parseCSV(String(r.result).replace(/^\uFEFF/,"")));
          if(!bank.length){$("#ecst").textContent="⚠️ 没筛出单词：请确认选择的是 ECDICT 的 ecdict.csv（不是别的 csv）";return}
          mergeBank(bank);
          let stored=true;
          try{localStorage.setItem("toeflExt",JSON.stringify(bank))}catch(err){stored=false}
          $("#ecst").textContent="✅ 成功导入 "+bank.length+" 词，当前总词库 "+BANK.length+" 词"+(stored?"（已保存在本机，下次打开自动加载）":"（本机存储空间不足，仅本次有效——请务必保存正在下载的 words.json）");
          const a=document.createElement("a");
          a.href=URL.createObjectURL(new Blob([JSON.stringify(bank)],{type:"application/json"}));
          a.download="words.json";a.click();
          toast("🎉 万词库导入完成！");
          renderSet();
        }catch(err){$("#ecst").textContent="⚠️ 解析出错："+err.message}
      },50);
    };
    r.readAsText(f,"utf-8");
  };
}

/* ---- ECDICT 解析器（CSV 状态机 + 托福筛选） ---- */
function parseCSV(text){
  const rows=[];let row=[],field="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else q=false}
      else field+=c;
    }else{
      if(c==='"')q=true;
      else if(c===","){row.push(field);field=""}
      else if(c==="\n"){row.push(field);field="";if(row.some(x=>x!==""))rows.push(row);row=[]}
      else if(c!=="\r")field+=c;
    }
  }
  row.push(field);if(row.some(x=>x!==""))rows.push(row);
  return rows;
}
function ecdictToBank(rows,GOAL){
  GOAL=GOAL||10000;
  if(!rows.length)return[];
  const head=rows[0].map(s=>s.trim().toLowerCase());
  const col=n=>head.indexOf(n);
  const iw=col("word"),ip=col("phonetic"),ide=col("definition"),itr=col("translation"),ipo=col("pos"),itag=col("tag"),ib=col("bnc"),ifq=col("frq");
  if(iw<0)return[];
  const POSMAP={n:"n.",v:"v.",a:"adj.",r:"adv.",j:"adj.",p:"prep.",c:"conj.",i:"int.",d:"art.",u:"int."};
  const cand=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r];if(row.length<3)continue;
    const tag=(row[itag]||"").toLowerCase();
    let pri;
    if(tag.includes("toefl"))pri=0;
    else if(tag.includes("ky"))pri=1;
    else if(tag.includes("ielts")||(tag.includes("cet6")&&!tag.includes("cet4")))pri=2;
    else if(tag.includes("gre"))pri=3;
    else continue;
    const word=(row[iw]||"").trim().toLowerCase();
    if(!/^[a-z][a-z'-]{2,}$/.test(word))continue;
    const tr=(row[itr]||"").replace(/\\n|\n/g,"；").replace(/\s+/g," ").trim();
    const de=(row[ide]||"").replace(/\\n|\n/g,"; ").replace(/\s+/g," ").trim();
    if(!tr&&!de)continue;
    const poss=[];
    (row[ipo]||"").split("/").forEach(p=>{const k=p.split(":")[0].trim();if(POSMAP[k]&&!poss.includes(POSMAP[k]))poss.push(POSMAP[k])});
    let frq=parseInt(row[ifq])||parseInt(row[ib])||999999;
    cand.push([pri,frq,[word,poss.slice(0,2).join("/"),tr,de,(row[ip]||"").trim()]]);
  }
  cand.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const seen=new Set(),bank=[];
  for(const c of cand){
    if(seen.has(c[2][0]))continue;
    seen.add(c[2][0]);bank.push(c[2]);
    if(bank.length>=GOAL)break;
  }
  return bank;
}

/* ============ 6. 提醒调度 ============ */
function fireNotif(title,body){
  beep();
  try{
    if("serviceWorker"in navigator&&navigator.serviceWorker.controller){
      navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:"icon.svg",tag:"toefl"}));return
    }
  }catch(e){}
  if("Notification"in window&&Notification.permission==="granted"){try{new Notification(title,{body,icon:"icon.svg"})}catch(e){}}
}
setInterval(()=>{
  if(!S.stage)return;
  const n=new Date(),td=dk(n);
  const hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  const done=S.checkins[td]&&S.checkins[td].done;
  let ch=false;
  S.reminders.forEach(t=>{
    const key=td+"|"+t;
    if(!S.notified[key]&&hm>=t){S.notified[key]=1;ch=true;
      if(!done)fireNotif("🍷 TOEFL 打卡提醒","今天还没打卡：新词 "+S.dailyN+" 个 + 复盘昨日 + 一篇文章 · 已连续 "+$("#streakN").textContent+" 天，别断在今天 🔥")}
  });
  if(ch)save();
},20000);

/* ============ 7. PWA / 启动 ============ */
let deferred=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#installBtn").style.display="";$("#installBtn").textContent="安装到本机"});
$("#installBtn").onclick=()=>{if(deferred){deferred.prompt();deferred=null}else toast("请通过浏览器菜单“安装应用/添加到主屏幕”安装")};
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
/* 词库加载顺序：本机导入缓存 → words.json → （可选 articles.json） */
try{const ext=JSON.parse(localStorage.getItem("toeflExt")||"[]");if(Array.isArray(ext)&&ext.length){mergeBank(ext);}}catch(e){}
fetch("words.json").then(r=>r.ok?r.json():null).then(d=>{if(Array.isArray(d)&&d.length){mergeBank(d);render()}}).catch(()=>{});
fetch("articles.json?_t=" + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    if (Array.isArray(d) && d.length) {
      const oldLen = ARTICLES.length;
      const knownTitles = new Set(ARTICLES.map(a => a.title));
      d.forEach(a => {
        if (a && a.title && !knownTitles.has(a.title)) {
          ARTICLES.push(a);
          knownTitles.add(a.title);
        }
      });
      if (ARTICLES.length > oldLen) {
        if (!S.artQueue) S.artQueue = [];
        for (let i = oldLen; i < ARTICLES.length; i++) {
          if (!S.artQueue.includes(i) && (!S.artToday || S.artToday.idx !== i)) {
            S.artQueue.push(i);
          }
        }
        save();
        render();
      }
    }
  })
  .catch(() => {});
$("#tabs").innerHTML=TABS.map(t=>`<button data-v="${t[0]}">${t[1]}</button>`).join("");
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.v));
render();
